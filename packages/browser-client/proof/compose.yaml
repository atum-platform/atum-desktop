# Real isolated upstream services. No proxy, federation, operator client or existing volume.
name: atum-cx-browser-proof
services:
  postgres:
    image: docker.io/library/postgres@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    pull_policy: never
    mem_limit: 256m
    environment:
      POSTGRES_DB: mas
      POSTGRES_USER: mas
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    secrets: [database_password]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mas]
      interval: 2s
      timeout: 3s
      retries: 30
  synapse:
    image: docker.io/matrixdotorg/synapse:v1.161.0@sha256:6b95dd129e35e97e8032cb759e5db4a516a5f7ef6c98d34d716fea1ae239b62a
    pull_policy: never
    mem_limit: 512m
    user: '${PROOF_UID:?run through stack.mjs}:${PROOF_GID:?run through stack.mjs}'
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    ports: ['127.0.0.1:22908:8008', '127.0.0.1:22909:8448']
    volumes: ['./.runtime/synapse:/data', './.runtime/tls:/tls:ro']
  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:1.24.0@sha256:52c18ffcc940220a3b6aa5985b7e09d24ac27f5ed10a4d660c312e48f73ff105
    pull_policy: never
    mem_limit: 512m
    user: '${PROOF_UID:?run through stack.mjs}:${PROOF_GID:?run through stack.mjs}'
    command: [server, --config, /config/generated.yaml, --config, /config/proof.json]
    ports: ['127.0.0.1:22980:8080', '127.0.0.1:22981:8443']
    volumes: ['./.runtime/mas:/config:ro', './.runtime/tls:/tls:ro']
    depends_on:
      postgres:
        condition: service_healthy
secrets:
  database_password:
    file: ./.runtime/database-password
volumes:
  postgres:
