name: Public client checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.13.5
      # Native integration tests launch this checkout's .venv/bin/python directly.
      - name: Prepare locked project Python environment
        run: |
          uv sync --locked --python 3.14 --group dev --group test --extra all
          echo "HERMES_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
          echo "ATUM_REQUIRE_PY_SEAM=1" >> "$GITHUB_ENV"
          echo "ATUM_SYNC_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: node apps/desktop/scripts/check-client-boundary.mjs --typecheck-without-controller
      - run: npm run typecheck --workspace apps/desktop
      - run: npm run lint --workspace apps/desktop
      - run: npm run verify:cloud-data-v1 --workspace apps/desktop
      - run: npm run check:test:upstream-watch --workspace apps/desktop
      - run: npm exec --workspace apps/desktop -- vitest run --maxWorkers 4

# Artifact allowlist is empty: no logs, captures, packages or release artifacts uploaded.
# No shared caches or release/signing authority in public CI.

  hermes-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.13.5
      - run: bash scripts/run_tests.sh --slice ${{ matrix.slice }}/8 -j 2 --file-timeout 300

  # Branch protection requires the single context `hermes`; it passes only when every slice passed.
  hermes:
    if: always()
    needs: [hermes-slice]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.hermes-slice.result }}" = success

  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.15.10
      - run: ruff check .
      - run: python scripts/check-windows-footguns.py --all

  dependency-audit:
    name: Public dependency OSV scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install checksum-pinned OSV scanner
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-delay 5 \
            -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/osv-scanner"
      - name: Scan public dependency locks
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile=uv.lock \
            --lockfile=package-lock.json

  workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [apps/shared, packages/atum-kit, packages/browser-client, packages/device-protocol, packages/model-client, ui-tui, ui-tui/packages/hermes-ink, web]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check --workspace ${{ matrix.package }}

  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      CI: 'true'
      OPENROUTER_API_KEY: ''
      OPENAI_API_KEY: ''
      NOUS_API_KEY: ''
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential libnotify4 libxss1 libxtst6 libssl3t64 python3 python3-venv xdg-utils
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # Host toolcache Python may link a newer OpenSSL than Noble provides.
      # Bootstrap uv with Noble's interpreter, then use its portable managed Python.
      - name: Bootstrap uv with container Python
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
          "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install uv==0.13.5
          echo "$RUNNER_TEMP/uv-bootstrap/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: uv sync --locked --managed-python --python 3.14 --group dev --group test --extra all
      - name: Client E2E (bootstrap screenshots, no uploads)
        working-directory: apps/desktop
        run: npm run build:e2e && xvfb-run -a --server-args="-screen 0 1280x1024x24" npx playwright test --workers=1 --reporter=list --update-snapshots
