# Overlay on self-work.yaml in a separate gateway profile.
editor_mcp_tools:
  t3-code: [t3_thread_read, t3_thread_list, t3_thread_wait]
approvals:
  mode: manual
  # A floor under every approvals mode, yolo included (gate 4b, docs/work-subscriptions.md). Globs are matched, case-folded, against the
  # command and its quote-stripped variants. A floor, not a sandbox: the same macOS user keeps what the OS gives them.
  deny:
    # T3's own thread tools and its editor bridge
    - '*t3 thread *'
    - '*t3 acp-mcp-*'
    - '*t3-orchestrator *'
    # The rest of the sidecar's `t3` CLI: auth and pair mint a session or a pairing credential (a way to anything, a plan thread
    # included), environment links another server, serve/service/up/update/doctor move or restart this one. Every spelling of the
    # command word: bare, as a path, after a space, a separator, a subshell or a backtick.
    - 't3'
    - 't3 *'
    - '*/t3'
    - '*/t3 *'
    - '*[ ;&|(`]t3'
    - '*[ ;&|(`]t3 *'
    # The plan makers' own clients (Codex; Claude and Antigravity stay unreachable until their makers confirm background use)
    - '*codex *'
    - 'codex'
    - '*/codex'
    - '*[ ;&|(`]codex'
    - '*claude *'
    - 'claude'
    - '*/claude'
    - '*[ ;&|(`]claude'
    - '*antigravity *'
    - 'antigravity'
    - '*/antigravity'
    - '*[ ;&|(`]antigravity'
    # Codex's own login store (the plan's token lives there and nowhere else)
    - '*.codex*'
