explainer.exit.fallback_prior_turn_content: "không có nội dung mới nào được tạo trong lượt này; đang hiển thị lại ngữ cảnh đã khôi phục của lượt trước. Gửi `continue` để thử lại."
explainer.exit.redirect_restart_limit_exceeded: "yêu cầu bị hủy bởi một yêu cầu chỉnh sửa mới trong mọi lần thử, nên lượt đã dừng thay vì thử lại vô hạn. Yêu cầu chỉnh sửa cuối cùng của bạn đã được xếp hàng làm tin nhắn tiếp theo."
explainer.exit.rebuilt_restart_limit_exceeded: "mọi provider trong chuỗi fallback liên tục lỗi nên phải chuyển sang provider dự phòng, khiến lượt đã dừng thay vì thử lại vô hạn. Gửi `continue` hoặc đổi provider."
explainer.exit.budget_exhausted: "ngân sách số lượt lặp/chi phí mỗi lượt đã cạn trước khi có câu trả lời cuối. Gửi `continue` để tiếp tục."
explainer.exit.ollama_runtime_context_too_small: "cửa sổ ngữ cảnh của mô hình cục bộ quá nhỏ để hoàn tất. Tăng kích thước ngữ cảnh hoặc dùng mô hình lớn hơn."
explainer.exit.pending_tool_result: "lượt đã dừng khi kết quả công cụ vẫn đang chờ và mô hình không tạo thêm văn bản nào. Gửi `continue` để nó tóm tắt."
explainer.exit.interrupted_during_api_call: "yêu cầu bị gián đoạn giữa lúc gọi API trước khi nhận được phản hồi. Gửi `continue` để thử lại."
explainer.exit.max_iterations_reached: "đã đạt giới hạn tối đa số lượt lặp công cụ trước khi có câu trả lời cuối. Gửi `continue` để tiếp tục, hoặc tăng `max_iterations`."
explainer.exit.error_near_max_iterations: "đã xảy ra lỗi gần giới hạn số lượt lặp trước khi có câu trả lời cuối. Kiểm tra output công cụ ở trên, rồi gửi `continue`."
explainer.exit.repeated_outer_errors: "lượt liên tục gặp lỗi lặp lại và đã bị dừng sớm thay vì thử lại vô hạn. Kiểm tra các lỗi ở trên, rồi gửi `continue` để thử lại."
explainer.persistence.compression: "lượt đã bị dừng vì một tiến trình khác đang nén phiên này. Tin nhắn của bạn có lẽ đã được lưu — vui lòng gửi lại sau khi quá trình nén hoàn tất."
explainer.persistence.compression_closed: "lượt đã bị dừng vì phiên này đã được thay thế bởi quá trình nén ngữ cảnh và phần chạy tiếp theo của nó không thể được tiếp nhận. Bản lưu trữ vẫn khỏe mạnh — hãy làm mới client (hoặc bắt đầu một lượt mới) để nó nhận ID phiên mới, rồi gửi lại tin nhắn của bạn."
explainer.persistence.turn_lease: "lượt đã bị dừng vì một tiến trình Hermes khác đã tiếp quản phiên này. Phản hồi của bạn chưa được lưu — hãy đợi tiến trình kia hoàn tất, rồi gửi lại tin nhắn của bạn."
explainer.persistence.session_row_missing: "phiên này đã bị xóa khỏi bộ lưu trữ trong khi hội thoại vẫn đang mở, và Hermes không thể tạo lại nó, nên tin nhắn này chưa được lưu. Hãy gửi lại tin nhắn của bạn; nếu vẫn tiếp tục thất bại, chạy `hermes {profile_arg}doctor`."
explainer.persistence.locked: "lượt đã bị dừng vì bộ lưu trữ phiên đang bận (một tiến trình Hermes khác đang ghi vào cơ sở dữ liệu trạng thái). Tin nhắn của bạn có lẽ đã được lưu — vui lòng đợi một lúc rồi gửi lại."
explainer.persistence.replaced: "tệp cơ sở dữ liệu phiên đã bị thay thế trong khi Hermes đang chạy, nên tin nhắn này chưa được lưu (một bản sao được giữ trong {home}/sessions/). Dừng Hermes (`hermes {profile_arg}gateway stop`), chạy `hermes {profile_arg}doctor` — không phải `hermes {profile_arg}doctor --fix`, vì lệnh đó sẽ sửa nhầm tệp ngay tại chỗ — rồi khởi động lại và gửi tin nhắn của bạn một lần nữa. Các bước khôi phục nâng cao có trong log."
explainer.persistence.deleted_wal: "một tiến trình Hermes khác vẫn đang giữ bản sao cũ của write-ahead log trong cơ sở dữ liệu phiên, nên Hermes đã ngừng ghi để giữ an toàn cho tệp và tin nhắn này chưa được lưu (một bản sao được giữ trong {home}/sessions/). Không có gì bị mất. Thoát mọi tiến trình Hermes trên profile này (ứng dụng Desktop, `hermes {profile_arg}gateway stop`, dashboard, cron), chạy `hermes {profile_arg}doctor` — nó sẽ chỉ ra tiến trình nào vẫn đang giữ log — rồi khởi động Hermes lại và gửi lại tin nhắn của bạn một lần nữa. Không chạy `doctor --fix` hay xóa bất kỳ tệp state.db nào trong lúc các tiến trình đó còn chạy. Hướng dẫn: {recovery_docs}"
explainer.persistence.corrupt: "lượt đã bị dừng vì cơ sở dữ liệu trạng thái báo hỏng cấu trúc (bản ghi hội thoại sẽ bị mất khi khởi động lại). Giải phóng dung lượng đĩa sẽ không giúp được gì. Các cách khôi phục:\n1. Chạy `hermes {profile_arg}doctor --fix`\n2. Dừng gateway, rồi khôi phục bằng:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (nếu báo có thể khôi phục) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — khôi phục sẽ chụp bản sao tệp bị hỏng trước tiên; KHÔNG chạy `sqlite3 ... \".recover\"` trên state.db đang chạy, sqlite3 CLI có lỗ hổng có thể làm hỏng thêm\n3. Khôi phục từ bản sao lưu trong {backups_dir}/\nSau đó gửi lại tin nhắn của bạn."
explainer.persistence.fts_index: "lượt đã bị dừng vì chỉ mục tìm kiếm phiên (FTS5) bị hỏng và không thể tách ra, nên tin nhắn này chưa được lưu. Kho tin nhắn không bị hư hại: đừng chạy công cụ khôi phục hay phục hồi bản sao lưu. Chạy `hermes {profile_arg}doctor --fix` (hoặc khởi động lại Hermes, chỉ mục sẽ được sửa khi mở), rồi gửi lại tin nhắn của bạn."
explainer.persistence.disk: "Hermes không thể lưu hội thoại này vào đĩa, nên đã dừng thay vì mất tin nhắn của bạn. Ổ đĩa có lẽ đã đầy: hãy giải phóng bớt dung lượng (hoặc sửa quyền truy cập trên {home}/state.db), rồi gửi lại tin nhắn của bạn."
explainer.persistence.default: "Hermes không thể lưu hội thoại này, nên đã dừng thay vì mất tin nhắn của bạn. Nguyên nhân có thể: ổ đĩa hết dung lượng, hoặc một tiến trình Hermes khác đang giữ cơ sở dữ liệu. Đóng các cửa sổ Hermes khác, chạy `hermes {profile_arg}doctor` để kiểm tra bộ lưu trữ, rồi gửi lại tin nhắn của bạn."
explainer.file_mutation.header: "⚠️ Trình xác minh thay đổi tệp: {count} lần sửa tệp ĐÃ THẤT BẠI trong lượt này, bất chấp bất kỳ diễn đạt nào ở trên có thể khiến bạn nghĩ điều ngược lại. Chạy `git status` hoặc `read_file` để xác nhận những gì thực sự được ghi."
explainer.file_mutation.entry: "  • `{path}` — [{tool}] {preview}"
explainer.file_mutation.failed: "thất bại"
explainer.shared.and_more: "  • … và {count} nữa"
explainer.shared.the_model: "Mô hình"
tips.t001: "/bg <prompt> chạy một tác vụ trong phiên riêng trong khi phiên hiện tại vẫn rảnh; /btw <question> trả lời câu hỏi phụ về hội thoại này mà không làm gián đoạn."
tips.t002: "/branch tách phiên hiện tại để bạn khám phá một hướng đi khác mà không mất tiến độ."
tips.t003: "/compress nén thủ công context hội thoại khi nó trở nên quá dài."
tips.t004: "/rollback liệt kê các checkpoint filesystem — khôi phục file mà agent đã sửa về bất kỳ trạng thái trước đó nào."
tips.t005: "/rollback diff 2 xem trước những gì đã thay đổi kể từ checkpoint 2 mà không khôi phục gì."
tips.t006: "/rollback 2 src/file.py khôi phục một file duy nhất từ checkpoint cụ thể."
tips.t007: "/title \"my project\" đặt tên cho phiên — sau đó tiếp tục bằng /resume hoặc hermes -c."
tips.t008: "/resume tiếp tục đúng chỗ bạn đang dở trong phiên đã đặt tên trước đó."
tips.t009: "/queue <prompt> đưa tin nhắn vào hàng đợi cho lượt sau mà không gián đoạn lượt hiện tại."
tips.t010: "/undo xóa lượt trao đổi user/assistant cuối cùng khỏi hội thoại."
tips.t011: "/retry gửi lại tin nhắn cuối của bạn — hữu ích khi câu trả lời của agent chưa đúng lắm."
tips.t012: "/verbose luân phiên chế độ hiển thị tiến trình tool: off → new → all → verbose."
tips.t013: "/reasoning high tăng độ sâu suy luận của mô hình. /reasoning show hiển thị phần suy luận."
tips.t014: "/fast bật/tắt xử lý ưu tiên để nhận phản hồi API nhanh hơn (tùy provider)."
tips.t015: "/yolo bỏ qua mọi prompt phê duyệt lệnh nguy hiểm trong phần còn lại của phiên."
tips.t016: "/model cho phép đổi mô hình giữa phiên — thử /model sonnet hoặc /model gpt-5."
tips.t017: "/model --global đổi mô hình mặc định của bạn vĩnh viễn."
tips.t018: "/personality pirate đặt một personality vui nhộn — 14 lựa chọn có sẵn từ kawaii đến shakespeare."
tips.t019: "/skin đổi theme CLI — thử ares, mono, slate, poseidon hoặc charizard."
tips.t020: "/statusbar bật/tắt thanh hiển thị thường trực mô hình, token, % context đã dùng, chi phí và thời lượng."
tips.t021: "/tools disable browser tạm gỡ các tool browser cho phiên hiện tại."
tips.t022: "/browser connect gắn các tool browser vào trình duyệt họ Chromium đang chạy của bạn qua CDP."
tips.t023: "/plugins liệt kê các plugin đã cài và trạng thái của chúng."
tips.t024: "/cron quản lý các tác vụ định kỳ — thiết lập prompt lặp lại với gửi kết quả tới bất kỳ nền tảng nào."
tips.t025: "/reload-mcp nạp lại cấu hình MCP server mà không cần khởi động lại."
tips.t026: "/usage hiển thị mức dùng token, phân bổ chi phí và thời lượng phiên."
tips.t027: "/insights hiển thị phân tích sử dụng trong 30 ngày gần nhất."
tips.t028: "/paste kiểm tra clipboard của bạn có ảnh và đính kèm vào tin nhắn kế tiếp."
tips.t029: "/profile hiển thị profile đang hoạt động và thư mục home của nó."
tips.t030: "/config xem nhanh cấu hình hiện tại của bạn."
tips.t031: "/stop kết thúc mọi tiến trình nền do agent khởi tạo."
tips.t032: "@file:path/to/file.py chèn nội dung file trực tiếp vào tin nhắn của bạn."
tips.t033: "@file:main.py:10-50 chỉ chèn các dòng 10-50 của file."
tips.t034: "@folder:src/ chèn cây thư mục dưới dạng danh sách."
tips.t035: "@diff chèn các thay đổi git chưa staged vào tin nhắn."
tips.t036: "@staged chèn các thay đổi git đã staged (git diff --staged)."
tips.t037: "@git:5 chèn 5 commit cuối cùng kèm toàn bộ patch."
tips.t038: "@url:https://example.com lấy và chèn nội dung một trang web."
tips.t039: "Gõ @ sẽ kích hoạt hoàn thiện đường dẫn filesystem — điều hướng đến bất kỳ file nào một cách tương tác."
tips.t040: "Kết hợp nhiều tham chiếu: \"Review @file:main.py and @file:test.py for consistency.\""
tips.t041: "Alt+Enter chèn xuống dòng cho input nhiều dòng. (Windows Terminal chặn Alt+Enter — dùng Ctrl+Enter thay thế.)"
tips.t042: "Ctrl+C gián đoạn agent. Nhấn đúp trong 2 giây để thoát bắt buộc."
tips.t043: "Ctrl+Z tạm dừng Hermes chạy nền — chạy fg trong shell để tiếp tục."
tips.t044: "Tab chấp nhận text gợi ý mờ hoặc hoàn thiện lệnh slash."
tips.t045: "Gõ tin nhắn mới trong khi agent đang chạy để gián đoạn và định hướng lại nó."
tips.t046: "Alt+V dán ảnh từ clipboard vào hội thoại."
tips.t047: "Dán 5+ dòng sẽ tự lưu thành file và chèn tham chiếu gọn thay thế."
tips.t048: "hermes -c tiếp tục phiên CLI gần nhất của bạn. hermes -c \"project name\" tiếp tục theo tiêu đề."
tips.t049: "hermes -w tạo một git worktree biệt lập — hoàn hảo cho các workflow agent song song."
tips.t050: "hermes -w -q \"Fix issue #42\" kết hợp biệt lập worktree với một truy vấn một lần."
tips.t051: "hermes chat -t web,terminal chỉ bật các toolset cụ thể cho một phiên tập trung."
tips.t052: "hermes chat -s github-pr-workflow nạp sẵn một skill khi khởi động."
tips.t053: "hermes chat -q \"query\" chạy một truy vấn đơn không tương tác rồi thoát."
tips.t054: "hermes chat --max-turns 1000 ghi đè giới hạn mặc định 500 lượt mỗi turn."
tips.t055: "hermes chat --checkpoints bật chụp nhanh filesystem trước mọi thay đổi file gây phá hủy."
tips.t056: "hermes --yolo bỏ qua mọi prompt phê duyệt lệnh nguy hiểm trong suốt phiên."
tips.t057: "hermes chat --source telegram gắn thẻ phiên để lọc trong hermes sessions list."
tips.t058: "hermes -p work chat chạy dưới một profile cụ thể mà không đổi mặc định của bạn."
tips.t059: "hermes doctor --fix chẩn đoán và tự sửa các vấn đề cấu hình và phụ thuộc."
tips.t060: "hermes dump xuất một bản tóm tắt thiết lập gọn — rất tiện cho báo cáo lỗi."
tips.t061: "hermes config set KEY VALUE tự điều hướng secret vào .env và phần còn lại vào config.yaml."
tips.t062: "hermes config edit mở config.yaml trong editor mặc định của bạn."
tips.t063: "hermes config check quét các tùy chọn cấu hình bị thiếu hoặc cũ."
tips.t064: "hermes sessions browse mở trình chọn phiên tương tác có tìm kiếm."
tips.t065: "hermes sessions stats hiển thị số lượng phiên theo nền tảng và kích thước database."
tips.t066: "hermes sessions prune --older-than 30 dọn các phiên cũ."
tips.t067: "hermes skills search react --source skills-sh tìm kiếm trong thư mục công khai skills.sh."
tips.t068: "hermes skills check quét các skill hub đã cài để tìm bản cập nhật từ nguồn gốc."
tips.t069: "hermes skills tap add myorg/skills-repo thêm nguồn skill GitHub tùy chỉnh."
tips.t070: "hermes skills snapshot export setup.json xuất cấu hình skill của bạn để sao lưu hoặc chia sẻ."
tips.t071: "hermes mcp add github --command npx thêm MCP server từ dòng lệnh."
tips.t072: "hermes mcp-serve chạy chính Hermes như một MCP server cho các tác tử khác."
tips.t073: "hermes auth add cho phép thêm nhiều API key để xoay vòng nhóm thông tin xác thực."
tips.t074: "hermes completion bash >> ~/.bashrc bật hoàn thiện tab cho mọi lệnh và profile."
tips.t075: "hermes logs -f theo dõi agent.log theo thời gian thực. --level WARNING --since 1h lọc đầu ra."
tips.t076: "hermes backup tạo file zip sao lưu toàn bộ thư mục home Hermes của bạn."
tips.t077: "hermes profile create coder tạo một profile biệt lập và biến nó thành lệnh riêng."
tips.t078: "hermes profile create work --clone sao chép cấu hình và key hiện tại sang profile mới."
tips.t079: "hermes update đồng bộ skill mới đóng gói sẵn đến TẤT CẢ các profile tự động."
tips.t080: "hermes gateway install thiết lập Hermes như một dịch vụ hệ thống (systemd/launchd)."
tips.t081: "hermes memory setup cho phép cấu hình provider bộ nhớ ngoài (Honcho, Mem0, v.v.)."
tips.t082: "hermes webhook subscribe tạo các route webhook theo sự kiện với xác thực HMAC."
tips.t083: "Tiết kiệm chi phí: hermes tools tắt các tool không dùng, hermes skills config cắt bớt skill."
tips.t084: "/reasoning low hoặc /reasoning minimal giảm độ sâu suy luận dưới mức mặc định (medium) — phản hồi nhanh hơn, rẻ hơn."
tips.t085: "hermes models định tuyến tác vụ vision, nén và phụ trợ sang mô hình rẻ hơn — cắt hơn 85% chi phí token nền mà không hạ mô hình chat chính."
tips.t086: "Đặt display.bell_on_complete: true trong config.yaml để nghe chuông khi các tác vụ dài hoàn tất."
tips.t087: "Đặt display.streaming: true để thấy token xuất hiện theo thời gian thực khi mô hình sinh nội dung."
tips.t088: "Đặt display.show_reasoning: true để theo dõi chuỗi suy luận (chain-of-thought) của mô hình."
tips.t089: "Đặt display.compact: true để giảm khoảng trắng trong đầu ra, thông tin dày hơn."
tips.t090: "Đặt display.busy_input_mode: queue để xếp hàng tin nhắn thay vì gián đoạn agent, hoặc steer để chèn giữa lúc chạy qua /steer."
tips.t091: "Đặt display.resume_display: minimal để bỏ qua phần tóm tắt lại toàn bộ hội thoại khi tiếp tục phiên."
tips.t092: "Đặt compression.threshold: 0.50 để kiểm soát thời điểm tự nén kích hoạt (mặc định: 50% context)."
tips.t093: "Đặt agent.max_turns: 1000 để agent thực hiện nhiều bước gọi tool hơn mỗi lượt."
tips.t094: "Đặt file_read_max_chars: 200000 để tăng nội dung tối đa cho mỗi lần gọi read_file."
tips.t095: "Đặt approvals.mode: smart để LLM tự phê duyệt lệnh an toàn và tự từ chối lệnh nguy hiểm."
tips.t096: "Đặt fallback_model trong config.yaml để tự động chuyển sang provider dự phòng khi lỗi."
tips.t097: "Đặt privacy.redact_pii: true để băm user ID và số điện thoại trước khi gửi cho LLM."
tips.t098: "Đặt browser.record_sessions: true để tự ghi các phiên browser thành video WebM."
tips.t099: "Đặt worktree: true trong config.yaml để luôn tạo git worktree (giống hermes -w)."
tips.t100: "Đặt security.website_blocklist.enabled: true để chặn các tên miền cụ thể khỏi web tools."
tips.t101: "Đặt cron.wrap_response: false để gửi đầu ra thô của agent không kèm header/footer cron."
tips.t102: "HERMES_TIMEZONE ghi đè múi giờ server bằng chuỗi IANA bất kỳ."
tips.t103: "Thay thế biến môi trường hoạt động trong config.yaml: dùng cú pháp ${VAR_NAME}."
tips.t104: "Quick commands trong config.yaml chạy lệnh shell tức thì, tốn 0 token."
tips.t105: "Personality tùy chỉnh có thể định nghĩa trong config.yaml dưới agent.personalities."
tips.t106: "provider_routing kiểm soát sắp xếp, whitelist và blacklist provider OpenRouter."
tips.t107: "execute_code chạy script Python gọi các tool Hermes theo chương trình — kết quả không vào context."
tips.t108: "delegate_task khởi tạo tới 10 sub-agent chạy đồng thời theo mặc định (delegation.max_concurrent_children) với context biệt lập cho công việc song song."
tips.t109: "web_extract hoạt động với URL PDF — đưa link PDF bất kỳ và nó chuyển thành markdown."
tips.t110: "search_files dựa trên ripgrep và nhanh hơn grep — hãy dùng nó thay cho grep trong terminal."
tips.t111: "patch dùng 9 chiến lược khớp mờ nên khác biệt nhỏ về khoảng trắng không làm hỏng việc sửa."
tips.t112: "patch hỗ trợ định dạng V4A để sửa nhiều file hàng loạt trong một lần gọi."
tips.t113: "read_file gợi ý tên file tương tự khi không tìm thấy file."
tips.t114: "read_file tự khử trùng lặp — đọc lại file không đổi sẽ trả về stub nhẹ."
tips.t115: "browser_vision chụp ảnh màn hình và phân tích bằng AI — dùng được cho CAPTCHA và nội dung trực quan."
tips.t116: "browser_console có thể chạy biểu thức JavaScript trong ngữ cảnh trang."
tips.t117: "image_generate tạo ảnh với FLUX 2 Pro và tự động upscale 2x."
tips.t118: "text_to_speech chuyển text thành âm thanh — hiển thị bong bóng voice trên Telegram."
tips.t119: "send_message có thể gửi đến mọi nền tảng nhắn tin đã kết nối ngay trong phiên."
tips.t120: "Tool todo giúp agent theo dõi các tác vụ nhiều bước phức tạp trong phiên."
tips.t121: "session_search tìm kiếm toàn văn trên TẤT CẢ các hội thoại trước đây."
tips.t122: "Agent tự lưu lựa chọn, chỉnh sửa và thông tin môi trường vào memory."
tips.t123: "/moa điều phối một prompt khó qua bộ mô hình Mixture of Agents đã cấu hình."
tips.t124: "Lệnh terminal hỗ trợ chế độ nền với notify_on_complete cho tác vụ chạy dài."
tips.t125: "Tiến trình nền terminal hỗ trợ watch_patterns để báo động theo dòng đầu ra cụ thể."
tips.t126: "Tool terminal hỗ trợ 6 backend: local, Docker, SSH, Modal, Daytona và Singularity."
tips.t127: "Mỗi profile có config, API key, memory, phiên, skill và cron job riêng."
tips.t128: "Tên profile trở thành lệnh shell — 'hermes profile create coder' tạo ra lệnh 'coder'."
tips.t129: "hermes profile export coder -o backup.tar.gz tạo một bản lưu trữ profile di động."
tips.t130: "Nếu hai profile vô tình dùng chung bot token, gateway thứ hai bị chặn kèm thông báo lỗi rõ ràng."
tips.t131: "Phiên tự sinh tiêu đề mô tả sau lượt trao đổi đầu tiên — không cần đặt tên thủ công."
tips.t132: "Tiêu đề phiên hỗ trợ dòng dõi: \"my project\" → \"my project #2\" → \"my project #3\"."
tips.t133: "Khi thoát, Hermes in lệnh tiếp tục kèm ID phiên và số liệu."
tips.t134: "hermes sessions export backup.jsonl xuất mọi phiên để sao lưu hoặc phân tích."
tips.t135: "hermes -r SESSION_ID tiếp tục một phiên trước đó bất kỳ theo ID của nó."
tips.t136: "Memory là ảnh chụp cố định — thay đổi chỉ xuất hiện trong system prompt ở lần chạy phiên kế tiếp."
tips.t137: "Các mục memory tự động được quét theo mẫu prompt injection và rò rỉ dữ liệu."
tips.t138: "Agent có hai kho memory: ghi chú cá nhân (~2200 ký tự) và user profile (~1375 ký tự)."
tips.t139: "Các chỉnh sửa bạn đưa cho agent (\"không, làm kiểu này\") thường được tự lưu vào memory."
tips.t140: "Hơn 80 skill đóng gói sẵn phủ github, creative, mlops, productivity, research và nhiều hơn nữa."
tips.t141: "Mọi skill đã cài tự động trở thành lệnh slash — gõ / để xem tất cả."
tips.t142: "hermes skills install official/security/1password cài các skill tùy chọn từ repo."
tips.t143: "Skill có thể giới hạn trên hệ điều hành cụ thể — một số chỉ tải trên macOS hoặc Linux."
tips.t144: "skills.external_dirs trong config.yaml cho phép tải skill từ thư mục tùy chỉnh."
tips.t145: "Agent có thể tự tạo skill của mình như bộ nhớ thủ tục (procedural memory) qua skill_manage."
tips.t146: "/plan viết kế hoạch triển khai dạng markdown vào .hermes/plans/ mà không thực thi gì."
tips.t147: "Cron job có thể gắn skill: hermes cron add --skill blogwatcher \"Check for new posts\"."
tips.t148: "Đích gửi của cron bao gồm telegram, discord, slack, email, sms và hơn 12 nền tảng nữa."
tips.t149: "Nếu phản hồi cron bắt đầu bằng [SILENT], việc gửi bị ẩn đi — hữu ích cho job chỉ theo dõi."
tips.t150: "Cron hỗ trợ độ trễ tương đối (30m), chu kỳ (every 2h), biểu thức cron và mốc thời gian ISO."
tips.t151: "Cron job chạy trong phiên agent hoàn toàn mới — prompt phải tự chứa đầy đủ ngữ cảnh."
tips.t152: "Voice mode hoạt động mà không cần API key nếu faster-whisper đã cài (speech-to-text địa phương miễn phí)."
tips.t153: "Năm TTS provider khả dụng: Edge TTS (miễn phí), ElevenLabs, OpenAI, NeuTTS (chạy local miễn phí), MiniMax."
tips.t154: "/voice on bật voice mode trong CLI. Ctrl+B bật/tắt ghi âm push-to-talk."
tips.t155: "Streaming TTS đọc từng câu ngay khi sinh — bạn không phải đợi toàn bộ phản hồi."
tips.t156: "Tin nhắn voice trên Telegram, Discord, WhatsApp và Slack được tự động phiên âm."
tips.t157: "Hermes chạy trên 21 nền tảng nhắn tin: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email và nhiều hơn nữa."
tips.t158: "hermes gateway install thiết lập Hermes thành dịch vụ hệ thống khởi động cùng máy."
tips.t159: "DingTalk dùng Stream Mode — không cần webhook hay URL công khai."
tips.t160: "BlueBubbles đưa iMessage đến Hermes qua một server macOS chạy local."
tips.t161: "Route webhook hỗ trợ xác thực HMAC, giới hạn tốc độ và lọc sự kiện."
tips.t162: "API server cung cấp endpoint tương thích OpenAI, dùng được với Open WebUI và LibreChat."
tips.t163: "Chế độ kênh voice Discord: bot vào phòng voice, phiên âm lời nói và trả lời bằng giọng nói."
tips.t164: "group_sessions_per_user: true cho mỗi người một phiên riêng trong group chat."
tips.t165: "/sethome đánh dấu một chat là kênh home để nhận kết quả cron job."
tips.t166: "Gateway hỗ trợ timeout dựa trên không hoạt động — agent đang chạy có thể chạy vô thời hạn."
tips.t167: "Phê duyệt lệnh nguy hiểm có 4 mức: once, session, always (cho phép vĩnh viễn), deny."
tips.t168: "Chế độ phê duyệt thông minh dùng LLM để tự phê duyệt lệnh an toàn và đánh dấu lệnh nguy hiểm."
tips.t169: "Bảo vệ SSRF chặn mạng riêng, loopback, link-local và địa chỉ metadata cloud."
tips.t170: "ID phiên có tiền tố thời gian (20250305_091523_abcd) nên ls và jq sắp xếp tự nhiên."
tips.t171: "Tiến trình con MCP nhận môi trường đã lọc — chỉ các biến hệ thống an toàn được đi qua."
tips.t172: "File context (.hermes.md, AGENTS.md) được quét bảo mật prompt injection trước khi nạp."
tips.t173: "command_allowlist trong config.yaml phê duyệt vĩnh viễn các mẫu lệnh shell cụ thể."
tips.t174: "Context tự nén khi đạt ngưỡng — memory được flush và lịch sử được tóm tắt."
tips.t175: "Thanh trạng thái chuyển vàng, rồi cam, rồi đỏ khi context lấp đầy."
tips.t176: "SOUL.md là file định danh chính của agent — tùy biến nó để định hình hành vi."
tips.t177: "Hermes nạp context dự án từ .hermes.md, AGENTS.md, CLAUDE.md hoặc .cursorrules (khớp đầu tiên)."
tips.t178: "File AGENTS.md trong thư mục con được phát hiện dần khi agent đi vào từng thư mục."
tips.t179: "File context bị giới hạn 20.000 ký tự với cơ chế cắt head/tail thông minh."
tips.t180: "Năm browser provider: Chromium local, Browserbase, Browser Use, Camofox và Firecrawl."
tips.t181: "Camofox là trình duyệt chống phát hiện — bản fork Firefox với giả lập fingerprint bằng C++."
tips.t182: "browser_navigate tự trả về snapshot trang — không cần gọi browser_snapshot sau đó."
tips.t183: "browser_vision với annotate=true phủ nhãn số lên các phần tử tương tác."
tips.t184: "hermes mcp mở trình chọn tương tác các MCP được Nous phê duyệt, cài chỉ với một phím."
tips.t185: "hermes mcp catalog liệt kê các MCP server do Nous phê duyệt đi kèm repo."
tips.t186: "hermes mcp install <name> cài một mục trong catalog, hỏi thông tin xác thực và cho bạn chọn tool nào sẽ bật."
tips.t187: "MCP server được cấu hình trong config.yaml — hỗ trợ cả hai transport stdio và HTTP."
tips.t188: "Lọc tool theo từng server: tools.include whitelist và tools.exclude blacklist các tool cụ thể."
tips.t189: "MCP server tự sinh toolset lúc chạy — hermes tools có thể bật/tắt từng nền tảng."
tips.t190: "Hỗ trợ MCP OAuth: auth: oauth bật cấp quyền qua trình duyệt với PKCE."
tips.t191: "Checkpoint không tốn chi phí khi không có file nào bị sửa — bật theo mặc định."
tips.t192: "Một snapshot trước rollback được lưu tự động để bạn có thể hoàn tác lại lần undo."
tips.t193: "/rollback cũng hoàn tác cả lượt hội thoại, nên agent không nhớ các thay đổi đã rollback."
tips.t194: "Checkpoint dùng shadow repo trong ~/.hermes/checkpoints/ — .git của dự án bạn không bao giờ bị đụng tới."
tips.t195: "batch_runner.py xử lý hàng trăm prompt song song để tạo dữ liệu huấn luyện."
tips.t196: "hermes chat -Q bật quiet mode cho mục đích chạy chương trình — ẩn banner và spinner."
tips.t197: "Lưu trajectory (--save-trajectories) ghi lại toàn bộ dấu vết sử dụng tool để huấn luyện mô hình."
tips.t198: "Ba loại plugin: general (tools/hooks), memory provider và context engine."
tips.t199: "hermes plugins install owner/repo cài plugin trực tiếp từ GitHub."
tips.t200: "Nhà cung cấp bộ nhớ ngoài: Honcho, Hindsight, Mem0, OpenViking và nhiều lựa chọn khác qua hermes plugins install."
tips.t201: "Hook plugin gồm pre/post_tool_call, pre/post_llm_call và transform_terminal_output để chuẩn hóa đầu ra."
tips.t202: "Prompt caching (Anthropic) giảm chi phí nhờ tái sử dụng các tiền tố system prompt đã cache."
tips.t203: "Agent tự sinh tiêu đề phiên trong thread nền — không ảnh hưởng độ trễ."
tips.t204: "Định tuyến mô hình thông minh có thể tự chuyển query đơn giản sang mô hình rẻ hơn."
tips.t205: "Lệnh slash hỗ trợ khớp tiền tố: /h dẫn đến /help, /mod dẫn đến /model."
tips.t206: "Kéo đường dẫn file vào terminal tự động đính kèm ảnh hoặc gửi làm context."
tips.t207: ".worktreeinclude ở gốc repo liệt kê file gitignored cần sao chép vào worktree."
tips.t208: "hermes acp chạy Hermes như một ACP server cho tích hợp VS Code, Zed và JetBrains."
tips.t209: "Provider tùy chỉnh: lưu các endpoint đặt tên trong config.yaml dưới custom_providers."
tips.t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT chèn system prompt không bao giờ được lưu vào lịch sử."
tips.t211: "credential_pool_strategies hỗ trợ xoay vòng fill_first, round_robin, least_used và random."
tips.t212: "hermes auth add nous hoặc hermes auth add openai-codex thiết lập provider qua OAuth."
tips.t213: "API server hỗ trợ cả Chat Completions và Responses API với trạng thái phía server."
tips.t214: "tool_preview_length: 0 trong config hiển thị đường dẫn file đầy đủ trong bảng hoạt động của spinner."
tips.t215: "hermes status --deep chạy kiểm tra chẩn đoán sâu hơn trên mọi thành phần."
tips.t216: "Cron job có thể gắn script Python (--script) có stdout được chèn vào prompt làm context."
tips.t217: "Script cron nằm trong ~/.hermes/scripts/ và chạy trước agent — hoàn hảo cho pipeline thu thập dữ liệu."
tips.t218: "prefill_messages_file trong config.yaml chèn ví dụ few-shot vào mọi lần gọi API, không bao giờ lưu vào lịch sử."
tips.t219: "SOUL.md thay thế hoàn toàn định danh mặc định của agent — viết lại để biến Hermes thành của riêng bạn."
tips.t220: "SOUL.md được gieo sẵn personality mặc định ở lần chạy đầu. Hãy sửa nó để tùy biến."
tips.t221: "/compress <focus topic> dành 60-70% ngân sách tóm tắt cho chủ đề của bạn và cắt mạnh phần còn lại."
tips.t222: "Từ lần nén thứ hai trở đi, bộ nén cập nhật bản tóm tắt trước thay vì bắt đầu lại từ đầu."
tips.t223: "Trước khi gateway đặt lại phiên, Hermes tự flush các thông tin quan trọng vào memory ở nền."
tips.t224: "network.force_ipv4: true trong config.yaml sửa tình trạng treo trên server IPv6 hỏng — monkey-patches socket."
tips.t225: "Tool terminal chú thích các exit code phổ biến: grep trả về 1 = 'Không tìm thấy kết quả khớp (không phải lỗi)'."
tips.t226: "Lệnh terminal foreground thất bại tự thử lại tới 3 lần với backoff lũy thừa (2s, 4s, 8s)."
tips.t227: "Lệnh sudo trần tự được viết lại để bơm SUDO_PASSWORD từ .env — không cần nhập tương tác."
tips.t228: "Helper của execute_code yêu cầu import rõ ràng: from hermes_tools import json_parse, shell_quote, retry."
tips.t229: "7 sandbox tool của execute_code (web_search, terminal, read/write/search/patch) dùng RPC — không bao giờ vào context."
tips.t230: "Đọc cùng một vùng file 3+ lần sẽ kích hoạt cảnh báo. Từ lần 4 trở đi bị chặn cứng để tránh vòng lặp."
tips.t231: "write_file và patch phát hiện file bị sửa bên ngoài kể từ lần đọc cuối và cảnh báo về sự cũ."
tips.t232: "Định dạng patch V4A hỗ trợ directive Add File, Delete File và Move File — không chỉ Update."
tips.t233: "MCP server có thể yêu cầu LLM completion ngược lại qua sampling — agent trở thành tool của server."
tips.t234: "MCP server gửi notifications/tools/list_changed để kích hoạt đăng ký lại tool tự động mà không cần khởi động lại."
tips.t235: "delegate_task với acp_command: 'claude' khởi chạy Claude Code như một agent con từ bất kỳ nền tảng nào."
tips.t236: "Delegation có thread heartbeat — hoạt động của agent con được truyền về agent cha, tránh gateway timeout."
tips.t237: "Khi provider trả về HTTP 402 (payment required), auxiliary client tự chuyển sang provider kế tiếp."
tips.t238: "agent.tool_use_enforcement định hướng các mô hình hay mô tả hành động thay vì gọi tool — tự động cho GPT/Codex."
tips.t239: "agent.restart_after_turn_timeout để các turn đang chạy hoàn tất trước khi /restart vào stop(); restart_drain_timeout chỉ là ngân sách ngắt cưỡng bức sau khi stop() bắt đầu."
tips.t240: "agent.api_max_retries (mặc định 3) kiểm soát số lần agent thử lại một lần gọi API thất bại trước khi báo lỗi — hạ xuống để fallback nhanh hơn."
tips.t241: "Gateway cache các thể hiện AIAgent theo phiên — phá cache này sẽ làm hỏng prompt caching của Anthropic."
tips.t242: "Bất kỳ website nào cũng có thể công bố skill qua /.well-known/skills/index.json — skills hub tự động khám phá chúng."
tips.t243: "Nhật ký audit skill tại ~/.hermes/skills/.hub/audit.log ghi lại mọi thao tác cài đặt và gỡ bỏ."
tips.t244: "Worktree git cũ được dọn tự động: xóa cây sạch đã merge; cây không hoạt động có thay đổi hoặc commit chưa đẩy được lưu trữ trước, khôi phục bằng hermes worktree restore."
tips.t245: "Profile giới hạn trạng thái Hermes qua HERMES_HOME; tiến trình con của tool trên máy chủ vẫn giữ HOME thật trừ khi terminal.home_mode là profile."
tips.t246: "Biến môi trường HERMES_HOME_MODE (octal, ví dụ 0701) đặt quyền thư mục tùy chỉnh cho việc duyệt thư mục của web server."
tips.t247: "Container mode: đặt .container-mode trong HERMES_HOME và CLI trên máy chủ tự exec vào container."
tips.t248: "Ctrl+C có 5 mức ưu tiên: hủy ghi âm → hủy prompt → hủy picker → gián đoạn agent → thoát."
tips.t249: "Mọi lần gián đoạn trong lúc agent chạy được ghi vào ~/.hermes/interrupt_debug.log kèm dấu thời gian."
tips.t250: "BROWSER_CDP_URL kết nối browser tools với trình duyệt họ Chromium đang chạy bất kỳ — nhận WebSocket, HTTP hoặc host:port."
tips.t251: "BROWSERBASE_ADVANCED_STEALTH=true bật chống phát hiện nâng cao với Chromium tùy chỉnh (gói Scale)."
tips.t252: "CLI tự chuyển sang compact mode trên terminal hẹp hơn 80 cột."
tips.t253: "Quick commands hỗ trợ hai loại: exec (chạy trực tiếp lệnh shell) và alias (chuyển hướng sang lệnh khác)."
tips.t254: "Mô hình cho delegation theo tác vụ: delegation.model và delegation.provider trong config chuyển sub-agent sang mô hình rẻ hơn."
tips.t255: "delegation.reasoning_effort kiểm soát độc lập độ sâu suy luận của sub-agent."
tips.t256: "display.platforms trong config.yaml cho phép ghi đè hiển thị theo từng nền tảng: {telegram: {tool_progress: all}}."
tips.t257: "human_delay.mode trong config giả lập tốc độ gõ của con người — khoảng min_ms/max_ms cấu hình được."
tips.t258: "Migration phiên bản config chạy tự động khi nạp — key config mới xuất hiện mà không cần can thiệp thủ công."
tips.t259: "Mô hình GPT và Codex được hướng dẫn system prompt đặc biệt về kỷ luật tool và nghĩa vụ gọi tool."
tips.t260: "Mô hình Gemini nhận directive riêng về đường dẫn tuyệt đối, gọi tool song song và lệnh không tương tác."
tips.t261: "context.engine trong config.yaml có thể đặt thành tên plugin để dùng chiến lược quản lý context khác."
tips.t262: "Snapshot trang browser trên 15.000 ký tự bị cắt hoặc tự tóm tắt; snapshot đầy đủ được lưu vào cache/web để đọc bằng read_file."
tips.t263: "Bộ nén chạy một lượt tiền xử lý rẻ tiền: đầu ra tool trên 200 ký tự được thay bằng placeholder trước khi LLM chạy."
tips.t264: "Khi nén thất bại, các lần thử tiếp theo bị tạm dừng 10 phút để tránh dồn API."
tips.t265: "Lệnh nguy hiểm dài (>70 ký tự) có tùy chọn 'view' trong prompt phê duyệt để xem toàn bộ text trước."
tips.t266: "Trực quan mức âm thanh hiển thị thanh ▁▂▃▄▅▆▇ trong lúc ghi voice dựa trên RMS của micro."
tips.t267: "Tên profile không được trùng với binary sẵn có trên PATH — 'hermes profile create ls' sẽ bị từ chối."
tips.t268: "hermes profile create backup --clone-all sao chép mọi thứ (config, key, SOUL.md, memory, skill, phiên)."
tips.t269: "Phím ghi voice cấu hình được qua voice.record_key trong config.yaml — không chỉ Ctrl+B."
tips.t270: "File .cursorrules và .cursor/rules/*.mdc được tự phát hiện và nạp làm context dự án."
tips.t271: "File context hỗ trợ phát hiện 10+ mẫu prompt injection — Unicode vô hình, 'ignore instructions', cố gắng exfiltrate."
tips.t272: "GPT-5 và Codex dùng role 'developer' thay vì 'system' trong định dạng tin nhắn."
tips.t273: "Ghi đè auxiliary theo tác vụ: auxiliary.vision.provider, auxiliary.compression.model, v.v. trong config.yaml."
tips.t274: "Auxiliary client coi 'main' như một alias provider — phân giải thành provider + mô hình chính thực tế của bạn."
tips.t275: "hermes import-agent openclaw --dry-run xem trước chuyển đổi OpenClaw mà không ghi gì."
tips.t276: "Đường dẫn file dán kèm dấu ngoặc kép hoặc khoảng trắng đã escape được xử lý tự động — không cần dọn thủ công."
tips.t277: "Lệnh slash không bao giờ kích hoạt cơ chế thu gọn dán lớn — /command với tham số dài vẫn hoạt động đúng."
tips.t278: "Trong interrupt mode, lệnh slash gõ trong khi agent đang chạy bỏ qua logic gián đoạn và chạy ngay."
tips.t279: "HERMES_DEV=1 bỏ qua phát hiện container mode cho mục đích phát triển local."
tips.t280: "Mỗi MCP server có toolset riêng (mcp-servername) có thể bật/tắt độc lập qua hermes tools."
tips.t281: "Placeholder ${ENV_VAR} của MCP trong config được phân giải lúc khởi chạy server — gồm cả biến từ ~/.hermes/.env."
tips.t282: "Skill từ repo tin cậy (NousResearch) nhận mức bảo mật 'trusted'; skill cộng đồng được quét kỹ hơn."
tips.t283: "Khu cách ly skill tại ~/.hermes/skills/.hub/quarantine/ chứa các skill đang chờ rà soát bảo mật."
tips.t284: "/steer <prompt> chèn một ghi chú sau lần gọi tool kế tiếp — định hướng giữa tác vụ mà không gián đoạn."
tips.t285: "/goal <text> đặt mục tiêu Ralph-loop cố định — Hermes tự tiếp tục turn sau turn cho đến khi judge báo xong."
tips.t286: "/snapshot create [label] lưu snapshot trạng thái đầy đủ của cấu hình Hermes; /snapshot restore <id> hoàn tác sau này."
tips.t287: "/copy [N] sao chép câu trả lời assistant cuối vào clipboard, hoặc câu thứ N tính từ cuối nếu có số."
tips.t288: "/redraw buộc vẽ lại toàn bộ UI, sửa lệch terminal sau khi resize tmux hoặc lỗi chọn bằng chuột."
tips.t289: "/agents (alias /tasks) hiển thị các agent đang hoạt động và tác vụ nền đang chạy trong phiên hiện tại."
tips.t290: "/footer bật/tắt footer gateway trên câu trả lời cuối, hiển thị mô hình, % context và cwd."
tips.t291: "/busy queue|steer|interrupt kiểm soát việc nhấn Enter khi Hermes đang làm việc."
tips.t292: "/topic trong Telegram DM bật chế độ topic đa phiên do người dùng quản lý — /topic <id> khôi phục phiên cũ ngay trong chat."
tips.t293: "/approve session|always chạy lệnh nguy hiểm đang chờ với phạm vi tin cậy bạn chọn; /deny từ chối nó."
tips.t294: "/restart khởi động lại gateway một cách an toàn sau khi các lượt chạy đang thực hiện kết thúc, rồi ping người yêu cầu khi đã hoạt động trở lại."
tips.t295: "/kanban boards switch <slug> đổi board Kanban đa dự án đang hoạt động ngay từ trong chat."
tips.t296: "/reload nạp lại ~/.hermes/.env vào phiên đang chạy — nhận API key mới mà không cần khởi động lại."
tips.t297: "cronjob với no_agent=True chạy script theo lịch và gửi stdout trực tiếp — 0 token, 0 LLM."
tips.t298: "stdout rỗng của script cron nghĩa là tick im lặng — không gửi gì, hoàn hảo cho watchdog ngưỡng."
tips.t299: "HERMES_CRON_MAX_PARALLEL (mặc định 4) giới hạn số cron job chạy mỗi tick để các đợt dồn cục không bão hòa key của bạn."
tips.t300: "Gateway hook nằm dưới ~/.hermes/hooks/<name>/ với HOOK.yaml + handler.py — handler phải tên là `handle`."
tips.t301: "Sự kiện hook gồm gateway:startup, session:start, agent:step và đăng ký wildcard command:*."
tips.t302: "Thả một checklist ~/.hermes/BOOT.md và hook gateway:startup sẽ chạy nó như một agent one-shot mỗi lần khởi động."
tips.t303: "hermes curator run --dry-run xem trước curator sẽ lưu trữ hoặc hợp nhất gì mà không thay đổi bất cứ thứ gì."
tips.t304: "hermes curator pin <skill> neo cứng một skill chống cả lưu trữ tự động lẫn tool skill_manage của agent."
tips.t305: "hermes curator rollback khôi phục skill từ snapshot trước khi chạy — bản sao lưu nằm dưới skills/.curator_backups/."
tips.t306: "hermes auth reset <provider> [target] xóa cooldown và cờ cạn kiệt trên cả nhóm credential hoặc một credential theo index, id hoặc label."
tips.t307: "credential_pool_strategies.<provider>: round_robin xoay vòng key đều nhau thay vì mặc định fill_first."
tips.t308: "use_gateway: true trên từng tool điều hướng web, image, tts hoặc browser qua gói đăng ký Nous của bạn — không cần key thêm."
tips.t309: "provider_routing.data_collection: deny loại trừ các provider lưu dữ liệu trên OpenRouter."
tips.t310: "provider_routing.require_parameters: true chỉ điều hướng tới provider hỗ trợ mọi tham số trong yêu cầu của bạn."
tips.t311: "HERMES_TUI_RESUME=1 tự gắn lại vào phiên TUI gần nhất khi khởi chạy — tiện sau khi SSH đứt kết nối."
tips.t312: "HERMES_TUI_THEME=light|dark|<hex> ép theme TUI trên terminal không đặt COLORFGBG."
tips.t313: "Ctrl+G hoặc Ctrl+X Ctrl+E trong TUI mở buffer nhập liệu trong $EDITOR cho prompt nhiều dòng dài."
tips.t314: "TUI render LaTeX inline — $E=mc^2$ hiển thị thành ký hiệu math Unicode thay vì TeX thô."
tips.t315: "hermes dashboard khởi chạy web UI local tại 127.0.0.1:9119 — không có dữ liệu nào rời khỏi localhost."
tips.t316: "hermes dashboard nhúng toàn bộ TUI Hermes vào trình duyệt qua xterm.js và WebSocket PTY."
tips.t317: "Thả một file YAML trong ~/.hermes/dashboard-themes/ với hai màu palette để đổi giao diện toàn bộ dashboard."
tips.t318: "Plugin dashboard dạng drop-in: manifest.json + bundle JS trong ~/.hermes/dashboard-plugins/ — không cần build npm."
tips.t319: "layoutVariant: cockpit trong theme dashboard thêm thanh trái 260px mà plugin có thể điền qua slot sidebar."
tips.t320: "display.tool_progress_command: true mở /verbose trên các nền tảng nhắn tin; mặc định chỉ có trên CLI."
tips.t321: "HERMES_BACKGROUND_NOTIFICATIONS=result chỉ báo khi tác vụ nền hoàn tất (so với concise/all/error/off)."
tips.t322: "HERMES_WRITE_SAFE_ROOT giới hạn write_file/patch vào các tiền tố thư mục; nhiều đường dẫn qua os.pathsep (: hoặc ;)."
tips.t323: "HERMES_IGNORE_RULES bỏ qua tự nạp AGENTS.md, SOUL.md, .cursorrules, memory và skill nạp sẵn."
tips.t324: "HERMES_ACCEPT_HOOKS tự phê duyệt shell hook chưa từng gặp khai báo trong config.yaml mà không cần prompt TTY."
tips.t325: "auxiliary.goal_judge.model điều hướng judge của /goal sang mô hình rẻ, nhanh để giữ chi phí loop gần bằng 0."
tips.t326: "Checkpoint bỏ qua thư mục có hơn 50.000 file để tránh thao tác git chậm trên monorepo khổng lồ."
tips.t327: "tts.provider: piper chạy TTS local 44 ngôn ngữ trên CPU — voice tự tải về ~/.hermes/cache/piper-voices/."
tips.t328: "tts.providers.<name>.type: command ghim mọi engine TTS CLI với placeholder {input_path} và {output_path}."
tips.t329: "API_SERVER_ENABLED=true chạy endpoint tương thích OpenAI song song với gateway, dùng cho Open WebUI và LibreChat."
tips.t330: "GATEWAY_PROXY_URL chạy thiết lập tách rời: I/O nền tảng chạy local, việc của agent giao cho API server ở xa."
tips.t331: "MATRIX_DEVICE_ID ghim device ID ổn định cho E2EE — không có nó, key xoay vòng mỗi lần khởi động và giải mã lịch sử bị hỏng."
tips.t332: "TELEGRAM_WEBHOOK_SECRET bắt buộc khi TELEGRAM_WEBHOOK_URL được đặt — tạo bằng openssl rand -hex 32."
tips.t333: "batch_runner.py --resume khớp nội dung các prompt đã hoàn tất theo text để sắp lại dataset không chạy lại phần đã xong."
tips.t334: "/new bắt đầu phiên mới ngay tại chỗ (alias /reset) — ID phiên mới, lịch sử sạch, CLI vẫn mở."
tips.t335: "/clear xóa màn hình terminal VÀ bắt đầu phiên mới — một phím tắt cho việc reset trực quan."
tips.t336: "/history in hội thoại hiện tại ngay trong màn hình không cần rời CLI — tiện để đọc lại nhanh."
tips.t337: "/save ghi hội thoại hiện tại ra đĩa mà không kết thúc phiên."
tips.t338: "/status hiển thị nhanh thông tin phiên: ID, tiêu đề, mô hình, mức dùng token và thời gian đã trôi."
tips.t339: "/image <path> đính kèm file ảnh local cho prompt kế tiếp mà không cần dán hay kéo-thả."
tips.t340: "/platforms hiển thị trạng thái gateway và các nền tảng nhắn tin ngay trong chat."
tips.t341: "/commands phân trang toàn bộ danh sách lệnh slash + skill đã cài — hữu ích trên nền tảng không có hoàn thiện tab."
tips.t342: "/toolsets liệt kê mọi toolset khả dụng để bạn biết -t/--toolsets nhận gì."
tips.t343: "/voice tts bật chế độ chỉ TTS — agent trả lời bằng giọng nói nhưng bạn vẫn gõ prompt."
tips.t344: "/reload-skills quét lại ~/.hermes/skills/ để skill thả vào xuất hiện mà không cần khởi động lại phiên."
tips.t345: "/indicator kaomoji|emoji|unicode|ascii chọn kiểu chỉ báo bận của TUI hiển thị trong lúc agent chạy."
tips.t346: "/debug tải lên gói hỗ trợ (thông tin hệ thống + log) và trả về link chia sẻ — hoạt động cả trong chat."
tips.t347: "hermes -z \"<prompt>\" là dạng one-shot thuần nhất: câu trả lời cuối trên stdout, không gì khác — lý tưởng để pipe trong script."
tips.t348: "hermes chat --pass-session-id chèn ID phiên vào system prompt để agent có thể tự tham chiếu."
tips.t349: "hermes chat --image path/to/pic.png đính kèm ảnh local vào một truy vấn -q duy nhất, không cần bước upload riêng."
tips.t350: "hermes chat --ignore-user-config bỏ qua cấu hình người dùng đang hoạt động — báo lỗi tái lập được và lượt chạy CI."
tips.t351: "hermes chat --source tool gắn thẻ các chat chạy chương trình để chúng không làm lộn xộn hermes sessions list."
tips.t352: "hermes dump --show-keys gồm dấu vân tay API key đã che bớt để debug hỗ trợ sâu hơn."
tips.t353: "hermes sessions rename <ID> \"new title\" đổi tên phiên cũ bất kỳ; hermes sessions delete <ID> xóa một phiên."
tips.t354: "hermes import khôi phục bản zip backup Hermes đầy đủ; bản xuất JSON/JSONL phiên được nhập từ trang Sessions của dashboard."
tips.t355: "hermes fallback quản lý chuỗi fallback_model tương tác — không cần sửa tay config.yaml."
tips.t356: "hermes pairing xoay vòng token ghép nối DM — người nhắn tin đầu tiên sau khi xoay sẽ chiếm quyền truy cập bot."
tips.t357: "hermes setup dẫn người dùng lần đầu qua provider, key và kết nối nền tảng trong một luồng tương tác duy nhất."
tips.t358: "hermes status --deep chạy quét sức khỏe toàn bộ mọi thành phần; hermes status thường là bản xem nhanh."
tips.t359: "HERMES_AGENT_TIMEOUT=0 tắt cơ chế kill do không hoạt động của gateway với agent đang chạy — dùng cho các lượt nghiên cứu dài."
tips.t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 tự nạp plugin trong repo từ ./.hermes/plugins/ — được kiểm soát tin cậy theo thiết kế."
tips.t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 tắt cơ chế 'file đã đổi kể từ khi bạn đọc' trên patch và write_file."
tips.t362: "HERMES_ALLOW_PRIVATE_URLS=true cho web tools chạm tới localhost và mạng riêng — tắt theo mặc định trong gateway mode."
tips.t363: "HERMES_OPTIONAL_SKILLS=name1,name2 tự cài các skill catalog tùy chọn thêm vào ở lần chạy đầu theo profile."
tips.t364: "HERMES_BUNDLED_SKILLS trỏ tới cây skill đóng gói tùy chỉnh — được Homebrew và Nix packaging dùng."
tips.t365: "HERMES_DUMP_REQUEST_STDOUT=1 dump mọi payload yêu cầu API ra stdout thay vì file log."
tips.t366: "HERMES_OAUTH_TRACE=1 ghi log các lần trao đổi và làm mới token OAuth đã che bớt để debug xác thực provider."
tips.t367: "HERMES_STREAM_RETRIES (mặc định 3) kiểm soát số lần kết nối lại giữa luồng khi lỗi mạng tạm thời."
tips.t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false tắt các tin nhắn xác nhận ⚡/⏳/⏩ khi người dùng nhắn cho agent đang bận."
tips.t369: "HERMES_AGENT_NOTIFY_INTERVAL (mặc định 180s) đặt tần suất gateway báo tiến độ trong các turn dài."
tips.t370: "HERMES_RESTART_DRAIN_TIMEOUT (mặc định 900s) giới hạn thời gian /restart chờ các lượt chạy đang thực hiện trước khi buộc dừng."
tips.t371: "HERMES_CHECKPOINT_TIMEOUT (mặc định 30s) giới hạn thời gian tạo checkpoint filesystem — tăng lên với monorepo lớn."
tips.t372: "image_gen.model trong config.yaml chọn mô hình FAL: flux-2/klein, gpt-image-2, nano-banana-pro và nhiều hơn nữa."
tips.t373: "image_gen.provider điều hướng sinh ảnh qua plugin (OpenAI Images, Codex, FAL) thay vì mặc định."
tips.t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY trỏ phân tích vision tới endpoint tương thích OpenAI bất kỳ."
tips.t375: "API_SERVER_MODEL_NAME tùy chỉnh tên mô hình trên /v1/models — cần thiết khi dùng Open WebUI với nhiều hồ sơ."
tips.t376: "Plugin dashboard được phục vụ từ /dashboard-plugins/<name>/ — đặt tệp vào ~/.hermes/dashboard-plugins/."
tips.t377: "Chat với --source tool bị loại khỏi hermes sessions list theo mặc định — đặt --source rõ ràng để thấy chúng."
tips.placeholder.p01: "Hỏi bất cứ điều gì, hoặc gõ / để xem các lệnh…"
tips.placeholder.p02: "Tóm tắt những gì có trong thư mục này"
tips.placeholder.p03: "Soạn thư trả lời email cuối cùng trong hộp thư của tôi"
tips.placeholder.p04: "Lập kế hoạch cho một tính năng, rồi xây dựng từng bước"
tips.placeholder.p05: "Tìm và sửa một test đang lỗi"
tips.placeholder.p06: "Nghiên cứu chủ đề này và viết cho tôi một bản báo cáo ngắn"
tips.placeholder.p07: "Repo này gần đây có gì thay đổi?"
tips.placeholder.p08: "Chuyển các ghi chú này thành danh sách việc cần làm"
tips.placeholder.p09: "Giải thích lỗi này và cách khắc phục"
tips.placeholder.p10: "Đặt lời nhắc hoặc lên lịch tác vụ định kỳ"
tips.placeholder.p11: "Gõ / để duyệt các lệnh, hoặc Ctrl+P để mở palette"
