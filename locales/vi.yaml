gateway.topic.root_lobby: "Chat chính này được dành cho các lệnh hệ thống.\n\nĐể bắt đầu một chat Hermes mới, hãy mở topic All Messages ở đầu giao diện bot này và gửi bất kỳ tin nhắn nào ở đó. Telegram sẽ tạo một topic mới cho tin nhắn đó; mỗi topic hoạt động như một phiên Hermes độc lập."
gateway.topic.root_new: "Để bắt đầu một chat Hermes song song mới, hãy mở topic All Messages ở đầu giao diện bot này và gửi bất kỳ tin nhắn nào ở đó. Telegram sẽ tạo một topic mới cho nó.\n\nMỗi topic là một phiên Hermes độc lập. Chỉ dùng /new trong một topic hiện có nếu bạn muốn thay thế phiên hiện tại của topic đó."
gateway.topic.new_header: "Đã bắt đầu một phiên Hermes mới trong topic này.\n\nMẹo: để làm việc song song, hãy mở All Messages và gửi tin nhắn ở đó để tạo topic riêng thay vì dùng /new tại đây. /new sẽ thay thế phiên đang gắn với topic hiện tại."
gateway.topic.help: "/topic — bật chế độ DM đa phiên (một bot, nhiều chat song song)\n\nCách dùng:\n  /topic             Bật chế độ topic, hoặc hiện trạng thái nếu đã bật\n  /topic help        Hiện thông báo này\n  /topic off         Tắt chế độ topic và xóa các liên kết topic\n  /topic <id>        Trong một topic: khôi phục phiên cũ theo ID\n\nCách hoạt động:\n1. Chạy /topic một lần trong DM này — Hermes kiểm tra BotFather Threads\n   Settings đã được bật và chuyển sang chế độ đa phiên.\n2. Nhấn All Messages ở đầu bot và gửi bất kỳ tin nhắn nào.\n   Telegram tạo topic mới cho tin nhắn đó; mỗi topic là\n   một phiên Hermes độc lập (lịch sử mới, context mới).\n3. DM gốc trở thành sảnh hệ thống — gửi /topic, /status,\n   /help, /usage ở đó. Prompt thông thường gửi trong topic.\n4. /new trong một topic chỉ đặt lại phiên của topic đó.\n5. /topic <id> trong một topic khôi phục phiên cũ vào topic đó."
